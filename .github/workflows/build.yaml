name: Build
on: [push, pull_request]

jobs:
    build:
        strategy:
            matrix:
                os: [windows-latest, ubuntu-latest, macos-latest]

        runs-on: ${{ matrix.os }}

        steps:
            - uses: actions/checkout@v4

            - name: Configure
              run: cmake -S . -B build

            - name: Build
              run: cmake --build build
