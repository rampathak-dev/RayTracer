name: Build
on: [push, pull_request]

jobs:
    build:
        strategy:
            fail-fast: false

            matrix:
                os: [windows-latest, ubuntu-latest, macos-latest]

        runs-on: ${{ matrix.os }}

        steps:
            - uses: actions/checkout@v4

            - name: Install Vulkan (Ubuntu)
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libvulkan-dev

            - name: Configure
              run: cmake -S . -B build

            - name: Build
              run: cmake --build build
